<!DOCTYPE html>
<html lang="de" class="h-full">
<head>

    <!-- PWA & Mobile Meta Tags -->
    <title>Taschenrechner PWA</title>
    <meta name="theme-color" content="#0f172a">
    <meta name="description" content="Moderne, offline-fähige Taschenrechner PWA mit konfigurierbarem Logo & Icons">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Rechner">

    <!-- Dynamischer Apple Touch Icon Link (wird per JS befüllt) -->
    <link id="apple-touch-icon" rel="apple-touch-icon" href="">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Verhindert unbeabsichtigtes Zoomen auf iOS bei Doppel-Taps */
        touch-action: manipulation;
        
        /* Safe Area Padding für modernste Smartphones */
        body {
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* Glasmorphismus und benutzerdefinierte Effekte */
        .glass-panel {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glass-button {
            background: rgba(51, 65, 85, 0.5);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.15s ease-in-out;
            -webkit-tap-highlight-color: transparent;
        }
        .glass-button:hover {
            background: rgba(71, 85, 105, 0.7);
            transform: translateY(-1px);
        }
        .glass-button:active {
            transform: translateY(1px);
            background: rgba(99, 102, 241, 0.3);
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.3);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(100, 116, 139, 0.5);
            border-radius: 4px;
        }
    </style>
</head>
<body class="h-full bg-gradient-to-br from-slate-950 via-slate-900 to-indigo-950 text-slate-100 flex items-center justify-center p-2 sm:p-4 select-none font-sans overflow-x-hidden">

    <!-- PWA & Taschenrechner Skripte -->
    <script>
        /* =======================================================
           1. LOGO & ICON MANAGEMENT SYSTEM (Dynamic Canvas & Base64)
           ======================================================= */
        let currentIconDataURL = localStorage.getItem('custom_pwa_icon') || null;
        let currentAppTitle = localStorage.getItem('custom_pwa_title') || 'Rechner';

        // Generiert ein Standard-Icon auf Canvas
        function generateCanvasIcon(preset = 'default', size = 512) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');

            let gradient;
            let symbol = '÷=';

            switch (preset) {
                case 'neon':
                    gradient = ctx.createLinearGradient(0, 0, size, size);
                    gradient.addColorStop(0, '#06b6d4');
                    gradient.addColorStop(1, '#2563eb');
                    symbol = '∑';
                    break;
                case 'amber':
                    gradient = ctx.createLinearGradient(0, 0, size, size);
                    gradient.addColorStop(0, '#f59e0b');
                    gradient.addColorStop(1, '#e11d48');
                    symbol = '%';
                    break;
                case 'minimal':
                    gradient = ctx.createLinearGradient(0, 0, size, size);
                    gradient.addColorStop(0, '#10b981');
                    gradient.addColorStop(1, '#0f766e');
                    symbol = 'π';
                    break;
                default:
                    gradient = ctx.createLinearGradient(0, 0, size, size);
                    gradient.addColorStop(0, '#4f46e5');
                    gradient.addColorStop(1, '#db2777');
                    symbol = '÷=';
                    break;
            }

            // Hintergrund mit abgerundeten Ecken
            ctx.fillStyle = gradient;
            const radius = size * 0.22;
            ctx.beginPath();
            ctx.moveTo(radius, 0);
            ctx.lineTo(size - radius, 0);
            ctx.quadraticCurveTo(size, 0, size, radius);
            ctx.lineTo(size, size - radius);
            ctx.quadraticCurveTo(size, size, size - radius, size);
            ctx.lineTo(radius, size);
            ctx.quadraticCurveTo(0, size, 0, size - radius);
            ctx.lineTo(0, radius);
            ctx.quadraticCurveTo(0, 0, radius, 0);
            ctx.closePath();
            ctx.fill();

            // Text / Symbol
            ctx.fillStyle = '#ffffff';
            ctx.font = `bold ${Math.round(size * 0.42)}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(symbol, size / 2, size / 2);

            return canvas.toDataURL('image/png');
        }

        // Aktualisiert App Icons im DOM & PWA Manifest
        function applyIcon(dataUrl) {
            currentIconDataURL = dataUrl;
            localStorage.setItem('custom_pwa_icon', dataUrl);

            // 1. Header & Modal Previews aktualisieren
            document.getElementById('app-logo-container').innerHTML = `<img src="${dataUrl}" class="w-full h-full object-cover rounded-xl" alt="App Logo">`;
            document.getElementById('modal-preview-icon').innerHTML = `<img src="${dataUrl}" class="w-full h-full object-cover rounded-2xl" alt="Preview Logo">`;

            // 2. Apple Touch Icon aktualisieren
            document.getElementById('apple-touch-icon').href = dataUrl;

            // 3. Dynamic Web App Manifest neu registrieren
            registerDynamicManifest();
        }

        function handleLogoUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (e) {
                const img = new Image();
                img.onload = function () {
                    // Auf quadratisches Canvas rendern, damit es perfekt als PWA-Icon passt
                    const canvas = document.createElement('canvas');
                    canvas.width = 512;
                    canvas.height = 512;
                    const ctx = canvas.getContext('2d');

                    // Abgerundete Ecken zeichnen
                    const radius = 512 * 0.22;
                    ctx.beginPath();
                    ctx.moveTo(radius, 0);
                    ctx.lineTo(512 - radius, 0);
                    ctx.quadraticCurveTo(512, 0, 512, radius);
                    ctx.lineTo(512, 512 - radius);
                    ctx.quadraticCurveTo(512, 512, 512 - radius, 512);
                    ctx.lineTo(radius, 512);
                    ctx.quadraticCurveTo(0, 512, 0, 512 - radius);
                    ctx.lineTo(0, radius);
                    ctx.quadraticCurveTo(0, 0, radius, 0);
                    ctx.closePath();
                    ctx.clip();

                    // Bild zentriert und skaliert einzeichnen (cover-fit)
                    const aspect = img.width / img.height;
                    let drawWidth = 512;
                    let drawHeight = 512;
                    let offsetX = 0;
                    let offsetY = 0;

                    if (aspect > 1) {
                        drawWidth = 512 * aspect;
                        offsetX = -(drawWidth - 512) / 2;
                    } else {
                        drawHeight = 512 / aspect;
                        offsetY = -(drawHeight - 512) / 2;
                    }

                    ctx.drawImage(img, offsetX, offsetY, drawWidth, drawHeight);
                    const finalDataUrl = canvas.toDataURL('image/png');
                    applyIcon(finalDataUrl);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function selectPresetIcon(preset) {
            const iconUrl = generateCanvasIcon(preset, 512);
            applyIcon(iconUrl);
        }

        function updateAppTitle(title) {
            currentAppTitle = title || 'Rechner';
            document.getElementById('app-title-display').innerText = currentAppTitle;
            localStorage.setItem('custom_pwa_title', currentAppTitle);
            registerDynamicManifest();
        }

        function toggleCustomizerModal() {
            document.getElementById('customizer-modal').classList.toggle('hidden');
        }

        /* =======================================================
           2. DYNAMISCHES PWA WEB MANIFEST GENERATION
           ======================================================= */
        let manifestElement = null;

        function registerDynamicManifest() {
            if (!currentIconDataURL) {
                currentIconDataURL = generateCanvasIcon('default', 512);
            }

            const manifestContent = {
                name: currentAppTitle,
                short_name: currentAppTitle,
                description: "Moderne, offline-fähige Taschenrechner PWA",
                start_url: window.location.href,
                display: "standalone",
                background_color: "#0f172a",
                theme_color: "#0f172a",
                orientation: "portrait",
                icons: [
                    { src: currentIconDataURL, sizes: "192x192", type: "image/png", purpose: "any maskable" },
                    { src: currentIconDataURL, sizes: "512x512", type: "image/png", purpose: "any maskable" }
                ]
            };

            const manifestBlob = new Blob([JSON.stringify(manifestContent)], { type: 'application/json' });
            const manifestURL = URL.createObjectURL(manifestBlob);

            if (manifestElement) {
                manifestElement.remove();
            }

            manifestElement = document.createElement('link');
            manifestElement.rel = 'manifest';
            manifestElement.href = manifestURL;
            document.head.appendChild(manifestElement);
        }

        /* =======================================================
           3. INLINE SERVICE WORKER (Offline-Fähigkeit)
           ======================================================= */
        if ('serviceWorker' in navigator) {
            const swCode = `
                const CACHE_NAME = 'rechner-pwa-v2';
                self.addEventListener('install', (e) => {
                    self.skipWaiting();
                });
                self.addEventListener('activate', (e) => {
                    e.waitUntil(clients.claim());
                });
                self.addEventListener('fetch', (e) => {
                    e.respondWith(
                        fetch(e.request).catch(() => caches.match(e.request))
                    );
                });
            `;
            const swBlob = new Blob([swCode], { type: 'text/javascript' });
            const swURL = URL.createObjectURL(swBlob);
            
            navigator.serviceWorker.register(swURL).catch(err => {
                console.warn('ServiceWorker Hinweis:', err);
            });
        }

        /* =======================================================
           4. PWA INSTALL PROMPT PROZESS
           ======================================================= */
        let deferredPrompt;
        const pwaInstallBtn = document.getElementById('pwa-install-btn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            pwaInstallBtn.classList.remove('hidden');
        });

        pwaInstallBtn.addEventListener('click', async () => {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') {
                pwaInstallBtn.classList.add('hidden');
            }
            deferredPrompt = null;
        });

        window.addEventListener('appinstalled', () => {
            pwaInstallBtn.classList.add('hidden');
            deferredPrompt = null;
        });

        /* =======================================================
           5. TASCHENRECHNER CORE LOGIK
           ======================================================= */
        let currentOperand = '0';
        let previousOperand = '';
        let operation = null;
        let resetScreen = false;
        let history = [];

        const currentOperandElement = document.getElementById('current-operand');
        const previousOperandElement = document.getElementById('previous-operand');
        const historyListElement = document.getElementById('history-list');
        const historyPanel = document.getElementById('history-panel');
        const historyToggle = document.getElementById('history-toggle');

        historyToggle.addEventListener('click', () => {
            historyPanel.classList.toggle('hidden');
        });

        function showAlert(title, message) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = message;
            document.getElementById('custom-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('custom-modal').classList.add('hidden');
        }

        function appendNumber(number) {
            if (currentOperand === '0' || resetScreen) {
                currentOperand = number;
                resetScreen = false;
            } else {
                if (currentOperand.length < 15) {
                    currentOperand += number;
                }
            }
            updateDisplay();
        }

        function appendDot() {
            if (resetScreen) {
                currentOperand = '0.';
                resetScreen = false;
                updateDisplay();
                return;
            }
            if (!currentOperand.includes('.')) {
                currentOperand += '.';
                updateDisplay();
            }
        }

        function appendOperation(op) {
            if (operation !== null && !resetScreen) {
                compute();
            }
            previousOperand = currentOperand;
            operation = op;
            resetScreen = true;
            updateDisplay();
        }

        function toggleSign() {
            if (currentOperand === '0') return;
            if (currentOperand.startsWith('-')) {
                currentOperand = currentOperand.substring(1);
            } else {
                currentOperand = '-' + currentOperand;
            }
            updateDisplay();
        }

        function appendPercent() {
            const current = parseFloat(currentOperand);
            if (isNaN(current)) return;
            currentOperand = (current / 100).toString();
            updateDisplay();
        }

        function compute() {
            if (operation === null || resetScreen) return;
            
            let computation;
            const prev = parseFloat(previousOperand);
            const current = parseFloat(currentOperand);

            if (isNaN(prev) || isNaN(current)) return;

            let opSymbol = operation;

            switch (operation) {
                case '+': computation = prev + current; break;
                case '-': computation = prev - current; break;
                case '*': 
                    computation = prev * current; 
                    opSymbol = '×'; 
                    break;
                case '/':
                    if (current === 0) {
                        showAlert('Fehler', 'Division durch Null ist nicht erlaubt!');
                        clearAll();
                        return;
                    }
                    computation = prev / current;
                    opSymbol = '÷';
                    break;
                default: return;
            }

            computation = Math.round(computation * 100000000) / 100000000;
            const calculationString = `${formatNumber(prev)} ${opSymbol} ${formatNumber(current)}`;
            
            addToHistory(calculationString, computation);

            currentOperand = computation.toString();
            operation = null;
            previousOperand = '';
            resetScreen = true;
            updateDisplay();
        }

        function formatNumber(number) {
            const stringNumber = number.toString();
            const parts = stringNumber.split('.');
            const integerDigits = parseFloat(parts[0]);
            let integerDisplay = '';
            
            if (!isNaN(integerDigits)) {
                integerDisplay = integerDigits.toLocaleString('de-DE');
            }
            
            if (parts.length > 1) {
                return `${integerDisplay},${parts[1]}`;
            } else {
                return integerDisplay;
            }
        }

        function updateDisplay() {
            currentOperandElement.innerText = currentOperand.replace('.', ',');
            if (operation !== null) {
                let opDisplay = operation;
                if (operation === '*') opDisplay = '×';
                if (operation === '/') opDisplay = '÷';
                previousOperandElement.innerText = `${formatNumber(previousOperand)} ${opDisplay}`;
            } else {
                previousOperandElement.innerText = '';
            }
        }

        function clearAll() {
            currentOperand = '0';
            previousOperand = '';
            operation = null;
            resetScreen = false;
            updateDisplay();
        }

        function deleteDigit() {
            if (resetScreen) return;
            if (currentOperand.length === 1 || (currentOperand.length === 2 && currentOperand.startsWith('-'))) {
                currentOperand = '0';
            } else {
                currentOperand = currentOperand.slice(0, -1);
            }
            updateDisplay();
        }

        function addToHistory(expression, result) {
            history.unshift({ expression, result: formatNumber(result) });
            if (history.length > 20) history.pop();
            renderHistory();
        }

        function renderHistory() {
            if (history.length === 0) {
                historyListElement.innerHTML = '<div id="empty-history" class="text-slate-500 text-sm text-center py-10">Keine Berechnungen vorhanden</div>';
                return;
            }

            historyListElement.innerHTML = '';
            history.forEach(item => {
                const div = document.createElement('div');
                div.className = 'bg-slate-900/40 p-3 rounded-xl border border-slate-800/60 flex flex-col items-end';
                div.innerHTML = `
                    <span class="text-xs text-slate-400">${item.expression}</span>
                    <span class="text-base font-semibold text-slate-200">= ${item.result}</span>
                `;
                historyListElement.appendChild(div);
            });
        }

        function clearHistory() {
            history = [];
            renderHistory();
        }

        // Tastatursteuerung
        window.addEventListener('keydown', e => {
            if ((e.key >= '0' && e.key <= '9')) {
                appendNumber(e.key);
            } else if (e.key === '.' || e.key === ',') {
                appendDot();
            } else if (e.key === '+' || e.key === '-') {
                appendOperation(e.key);
            } else if (e.key === '*') {
                appendOperation('*');
            } else if (e.key === '/') {
                e.preventDefault();
                appendOperation('/');
            } else if (e.key === 'Enter' || e.key === '=') {
                compute();
            } else if (e.key === 'Backspace') {
                deleteDigit();
            } else if (e.key === 'Escape') {
                clearAll();
            } else if (e.key === '%') {
                appendPercent();
            }
        });

        // Initialisierung beim Start
        window.onload = function() {
            document.getElementById('app-title-input').value = currentAppTitle;
            document.getElementById('app-title-display').innerText = currentAppTitle;
            
            if (currentIconDataURL) {
                applyIcon(currentIconDataURL);
            } else {
                selectPresetIcon('default');
            }
        };
    </script>
</body>
</html>
